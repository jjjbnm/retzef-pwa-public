<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הודעה על שירות תיקונים</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 450px;
      width: 100%;
      border-top: 6px solid #e74c3c;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    h1 {
      color: #2c3e50;
      font-size: 24px;
      margin-bottom: 12px;
    }

    p {
      color: #555555;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      background-color: #3498db;
      color: #ffffff;
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🛠️</div>
    <h1>שירות התיקונים אינו זמין כרגע</h1>
    <p>אנחנו לא מקבלים תיקונים חדשים בפרק הזמן הקרוב. עמכם הסליחה על האי-נוחות, ונשמח לעמוד לשירותכם בהקדם.</p>
    <a href="mailto:support@example.com" class="btn">צור קשר במייל</a>
  </div>

</body>
</html>
