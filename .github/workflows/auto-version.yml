name: Auto bump version
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Classify and bump version
        shell: bash
        run: |
          message=$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")
          if [[ "$message" == "chore: auto-bump version [skip version]" ]]; then exit 0; fi
          node scripts/bump-version.js auto "$message"
          git add index.html
          git commit -m "chore: auto-bump version [skip version]"
          git push
